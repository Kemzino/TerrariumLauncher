name: Terrarium Launcher release

# Два способи запустити реліз:
#  1. Actions → "Terrarium Launcher release" → Run workflow → ввести версію X.Y.Z.
#     Воркфлоу сам підніме версію у файлах, закомітить у вибрану гілку, поставить тег і збере.
#  2. Запушити тег vX.Y.Z вручну (версія у файлах уже має збігатися з тегом).
#  3. Run workflow з полем tag = існуючий тег — лише перезібрати/дозбирати реліз (без бампа).
#
# Платформи: Windows x64 (NSIS) і macOS universal (Intel + Apple Silicon, .dmg + .app.tar.gz
# для оновлювача). Обидві збірки йдуть паралельно, реліз створює окрема джоба.
#
# Потрібен секрет TAURI_SIGNING_PRIVATE_KEY — вміст ~/.tauri/terrarium-launcher.key
# (і TAURI_SIGNING_PRIVATE_KEY_PASSWORD, якщо ключ із паролем). Див. docs-terrarium/RELEASE.md.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Нова версія (X.Y.Z, без v) — підніме версію, закомітить і поставить тег'
        required: false
        type: string
      tag:
        description: 'АБО існуючий тег (vX.Y.Z) — лише зібрати й опублікувати'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: terrarium-release
  cancel-in-progress: false

jobs:
  tag:
    name: Підняти версію і поставити тег
    if: github.event_name == 'workflow_dispatch' && inputs.tag == ''
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version, commit and tag
        id: bump
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$VERSION" ]; then
            echo "::error::Вкажи або version (нова версія), або tag (існуючий тег)"
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Версія має бути у форматі X.Y.Z, отримано '$VERSION'"
            exit 1
          fi
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::Тег $TAG уже існує"
            exit 1
          fi

          # Версія живе у трьох місцях (tauri.conf.json читає її з package.json)
          sed -i -E "0,/\"version\": \"[^\"]+\"/s//\"version\": \"$VERSION\"/" apps/app-frontend/package.json
          sed -i -E "0,/^version = \"[^\"]+\"/s//version = \"$VERSION\"/" apps/app/Cargo.toml
          sed -i -E "0,/^version = \"[^\"]+\"/s//version = \"$VERSION\"/" packages/app-lib/Cargo.toml
          perl -0pi -e "s/(name = \"theseus_gui\"\nversion = \")[^\"]+/\${1}$VERSION/; s/(name = \"theseus\"\nversion = \")[^\"]+/\${1}$VERSION/" Cargo.lock

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/app-frontend/package.json apps/app/Cargo.toml packages/app-lib/Cargo.toml Cargo.lock
          git commit -m "chore: release $TAG"
          git tag -a "$TAG" -m "Terrarium Launcher $VERSION"
          git push origin HEAD "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Зібрати (${{ matrix.name }})
    needs: [tag]
    # needs.tag пропускається при пуші тега або при inputs.tag — тоді збираємо одразу
    if: always() && (github.event_name == 'push' || inputs.tag != '' || needs.tag.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            bundles: nsis
            target: ''
            rust-target: ''
          - name: macOS universal
            os: macos-latest
            bundles: app,dmg
            target: universal-apple-darwin
            # раннер — Apple Silicon; для universal потрібен ще Intel-таргет
            rust-target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.tag.outputs.tag || inputs.tag || github.ref_name }}
      SQLX_OFFLINE: 'true'
    steps:
      - name: Check out tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Verify version matches tag and signing key is configured
        shell: bash
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          PKG_VERSION=$(jq -r .version apps/app-frontend/package.json)
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "::error::Тег $TAG, а в apps/app-frontend/package.json версія $PKG_VERSION"
            exit 1
          fi
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::Секрет TAURI_SIGNING_PRIVATE_KEY не заданий — без нього оновлення не підписати"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Setup Rust (rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ''
          target: ${{ matrix.rust-target }}
          cache-key: terrarium-release

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        run: corepack enable

      # Кешуємо pnpm store, а не node_modules: на Windows node_modules після
      # tar відновлюється битим (джанкшени в .pnpm дають EPERM, зникають
      # пакети — так упали збірки v1.0.4 і v1.0.5), а `pnpm install` на ньому
      # каже «Already up to date» і нічого не лагодить. Зі store лінкування
      # чистих node_modules займає ~1 хв — прийнятно за надійність.
      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare app-lib .env
        shell: bash
        env:
          # Ключ CurseForge API (console.curseforge.com) вбудовується в лаунчер:
          # без нього моди не з Modrinth показуються без іконок і оновлень
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          cp packages/app-lib/.env.prod packages/app-lib/.env
          if [ -n "$CURSEFORGE_API_KEY" ]; then
            # В одинарних лапках: ключ виду $2a$10$…, а dotenvy у build.rs
            # без лапок підставляє $2, $10 як змінні й спотворює його
            echo "CURSEFORGE_API_KEY='$CURSEFORGE_API_KEY'" >> packages/app-lib/.env
          else
            echo "::warning::CURSEFORGE_API_KEY не задано в secrets — CurseForge у лаунчері не працюватиме"
          fi

      # Ті самі кроки, що робить turbo для @modrinth/app-frontend#build, але явно
      - name: Build frontend
        run: |
          pnpm -w i18n:coverage
          pnpm --filter @modrinth/api-client build
          pnpm --filter @modrinth/app-frontend build

      # NSIS і nsis_tauri_utils tauri качає з GitHub Releases у %LOCALAPPDATA%/tauri — кешуємо,
      # бо ці завантаження періодично падають з 5xx
      - name: Cache Tauri bundler tools
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/tauri
          key: tauri-tools-${{ runner.os }}-nsis3

      - name: Build app (updater + minisign)
        shell: bash
        working-directory: apps/app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # create-dmg на CI без цього чекає на GUI
          TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
        run: |
          args=(build --ci --config tauri-release.conf.json --config tauri.local-release.conf.json --bundles "$BUNDLES")
          if [ -n "$TARGET" ]; then args+=(--target "$TARGET"); fi
          # Повтор на випадок тимчасових помилок завантаження інструментів бандлера;
          # cargo уже зібрано, тож повтор коштує секунди
          for attempt in 1 2 3; do
            if pnpm exec tauri "${args[@]}"; then
              exit 0
            fi
            echo "::warning::tauri build впав (спроба $attempt/3), повтор за 30 с"
            sleep 30
          done
          exit 1

      # Імена без пробілів: GitHub перейменовує асети, а URL у latest.json має бути передбачуваним
      - name: Collect release assets
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist-release
          if [ -n "$TARGET" ]; then BUNDLE="target/$TARGET/release/bundle"; else BUNDLE="target/release/bundle"; fi
          case "$RUNNER_OS" in
            Windows)
              SETUP=$(ls "$BUNDLE"/nsis/*_"${VERSION}"_x64-setup.exe)
              test -f "$SETUP.sig" || { echo "::error::Немає $SETUP.sig — збірка без ключа підпису?"; exit 1; }
              cp "$SETUP" "dist-release/Terrarium-Launcher_${VERSION}_x64-setup.exe"
              cp "$SETUP.sig" "dist-release/Terrarium-Launcher_${VERSION}_x64-setup.exe.sig"
              ;;
            macOS)
              APP_TGZ=$(ls "$BUNDLE"/macos/*.app.tar.gz)
              test -f "$APP_TGZ.sig" || { echo "::error::Немає $APP_TGZ.sig — збірка без ключа підпису?"; exit 1; }
              DMG=$(ls "$BUNDLE"/dmg/*.dmg)
              cp "$APP_TGZ" "dist-release/Terrarium-Launcher_${VERSION}_macos.app.tar.gz"
              cp "$APP_TGZ.sig" "dist-release/Terrarium-Launcher_${VERSION}_macos.app.tar.gz.sig"
              cp "$DMG" "dist-release/Terrarium-Launcher_${VERSION}_universal.dmg"
              ;;
          esac
          ls -la dist-release

      - name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ runner.os }}
          path: dist-release/
          if-no-files-found: error
          retention-days: 3

  release:
    name: Опублікувати реліз
    needs: [tag, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.tag.outputs.tag || inputs.tag || github.ref_name }}
    steps:
      - name: Check out tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Download assets
        uses: actions/download-artifact@v4
        with:
          pattern: assets-*
          path: dist-release
          merge-multiple: true

      - name: Write release notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          {
            echo "## Terrarium Launcher ${VERSION}"
            echo
            if [ -n "$PREV" ]; then
              echo "Зміни з ${PREV}:"
              echo
              git log --no-merges --pretty='- %s' "${PREV}..${TAG}" | grep -v '^- chore: release ' || true
            else
              echo "Перший реліз."
            fi
            echo
            echo "### Встановлення"
            echo
            echo "- **Windows**: \`Terrarium-Launcher_${VERSION}_x64-setup.exe\`. Інсталятор без сертифіката Authenticode — SmartScreen може попередити: «Докладніше» → «Виконати в будь-якому разі»."
            echo "- **macOS** (Intel і Apple Silicon): \`Terrarium-Launcher_${VERSION}_universal.dmg\`. Застосунок не нотаризований Apple — при першому запуску натисни правою кнопкою → «Відкрити», або в терміналі: \`xattr -cr \"/Applications/Terrarium Launcher.app\"\`."
            echo
            echo "Встановлені лаунчери оновлюються автоматично."
          } > dist-release/release-notes.md
          cat dist-release/release-notes.md

      # https://tauri.app/plugin/updater/#server-support — один universal .app.tar.gz на обидві macOS-архітектури
      - name: Generate latest.json (Tauri updater manifest)
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          jq -n \
            --arg version "$VERSION" \
            --rawfile notes dist-release/release-notes.md \
            --rawfile win_sig "dist-release/Terrarium-Launcher_${VERSION}_x64-setup.exe.sig" \
            --rawfile mac_sig "dist-release/Terrarium-Launcher_${VERSION}_macos.app.tar.gz.sig" \
            --arg win_url "${BASE}/Terrarium-Launcher_${VERSION}_x64-setup.exe" \
            --arg mac_url "${BASE}/Terrarium-Launcher_${VERSION}_macos.app.tar.gz" \
            '{
              version: $version,
              notes: $notes,
              pub_date: (now | todateiso8601),
              platforms: {
                "windows-x86_64": { signature: ($win_sig | rtrimstr("\n")), url: $win_url },
                "darwin-aarch64": { signature: ($mac_sig | rtrimstr("\n")), url: $mac_url },
                "darwin-x86_64":  { signature: ($mac_sig | rtrimstr("\n")), url: $mac_url }
              }
            }' > dist-release/latest.json
          cat dist-release/latest.json

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --verify-tag \
            --title "Terrarium Launcher ${VERSION}" \
            --notes-file dist-release/release-notes.md \
            "dist-release/Terrarium-Launcher_${VERSION}_x64-setup.exe" \
            "dist-release/Terrarium-Launcher_${VERSION}_x64-setup.exe.sig" \
            "dist-release/Terrarium-Launcher_${VERSION}_universal.dmg" \
            "dist-release/Terrarium-Launcher_${VERSION}_macos.app.tar.gz" \
            "dist-release/Terrarium-Launcher_${VERSION}_macos.app.tar.gz.sig" \
            dist-release/latest.json
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"
